services:
  # Ollama Service for Local LLM (Qwen)
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list | grep -q qwen2.5:7b && ollama list | grep -q all-minilm"]
      interval: 30s
      timeout: 30s
      retries: 30
      start_period: 900s
    networks:
      - rag-network
    # Pull models on startup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 10
        echo "=========================================="
        echo "Pulling Qwen2.5:7b model (this may take 5-10 minutes)..."
        echo "=========================================="
        ollama pull qwen2.5:7b
        echo "=========================================="
        echo "Pulling all-minilm embedding model..."
        echo "=========================================="
        ollama pull all-minilm
        echo "=========================================="
        echo "✅ All models downloaded and ready!"
        echo "=========================================="
        wait

  # RAG Chatbot Application
  rag-chatbot:
    build: .
    container_name: rag-qa-chatbot
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      # Optional: Uncomment to use OpenAI API
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
